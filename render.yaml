services:
  - type: web
    name: unified-anime-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_VERSION
        value: 2.1.1
      - key: CORS_ORIGIN
        value: "*"
      - key: RATE_LIMIT
        value: "120"
      - key: RATE_WINDOW_MS
        value: "60000"
      - key: STARTUP_TIMEOUT_MS
        value: "60000"
      - key: UPSTREAM_TIMEOUT_MS
        value: "30000"
      - key: TRUST_PROXY
        value: "true"
      - key: DISCOVERY_TIMEOUT_MS
        value: "10000"
      - key: EXTRACTION_TIMEOUT_MS
        value: "15000"
      - key: STREAM_VALIDATION_TIMEOUT_MS
        value: "7000"
      - key: HLS_VALIDATION_TIMEOUT_MS
        value: "5000"
      - key: TOTAL_REQUEST_DEADLINE_MS
        value: "60000"
      - key: MAX_VALIDATION_CANDIDATES
        value: "6"
      - key: RETRY_COUNT
        value: "1"
      - key: RETRY_BACKOFF_MS
        value: "250"
      - key: METADATA_TIMEOUT_MS
        value: "10000"
      - key: METADATA_EPISODES_TIMEOUT_MS
        value: "30000"
      - key: METADATA_CACHE_TTL_MS
        value: "300000"
